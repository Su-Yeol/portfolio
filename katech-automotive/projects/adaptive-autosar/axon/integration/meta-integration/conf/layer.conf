# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# This layer's recipes (*.bb, *.bbappend) are located here
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Layer name
BBFILE_COLLECTIONS += "meta-integration"
BBFILE_PATTERN_meta-integration = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-integration = "60"

# This should match your poky series (you said kirkstone)
LAYERSERIES_COMPAT_meta-integration = "kirkstone"