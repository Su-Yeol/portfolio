# ---------------------------------------------------------- ###
### ---------------- ControlModule Parameter --------------- ###
# ---------------------------------------------------------- ###
# Control
TargetSpeed = 10 # [kph] Kcity 제어 시 0

# RECORD
GPSRecord = f # default: f -> GPS raw 데이터 send를 위해서 Kcity에서 t
GPSRecordPath = "./data/GPS/" # S32G

# Path Operation 
ReceivePathFlag = f # default: f -> Kcity에서 실험 시 t로 진행
ReferenceFile = "./Reference/230717_PG2.txt" # 경로를 항상 ft.인규연구원님 폴더 내 txt 파일과 동일하게 매칭
ExternalIp = "192.168.100.99" # S32G IP , 127.0.0.1(로컬 ip)
ForwardPort = 1785 # 경로주는 모듈에서 S32G로 쏘는 포트, 99ip로 1785 port로 소켓이 바인딩
BackPort = 3862 # 버퍼를 만들어서 3862로 버퍼를 Send하면 받는쪽에서 3862 소켓을 바인딩하면 받는다

# Thread
ViewerFlag = f # bool

# Cycle [ms]
MainCycle = 50
MCUReceiveCycle = 30

# Communicate
BroadCastIp = "192.168.100.255"
S32GIp = "192.168.100.99"
S32GPort = 3004 # MCU
MCUIp = "192.168.100.88"
MCUPort = 4912
ViewerIp = "192.168.100.35"
ViewerPort = 2817
